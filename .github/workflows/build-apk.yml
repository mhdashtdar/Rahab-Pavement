
name: Build RahYab Pavement APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Extract project
        run: unzip -q RahYabPavement_GitHub_Build.zip

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build APK
        run: |
          cd RahYabPavement
          gradle --no-daemon assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: RahYabPavement-debug-apk
          path: RahYabPavement/app/build/outputs/apk/debug/*.apk
